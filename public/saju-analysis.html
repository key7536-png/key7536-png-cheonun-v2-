<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>✦ 천운 사주 기본분석</title>
<style>
:root{--bg:#09090e;--card:#12121a;--line:#292938;--text:#eeeaf7;--muted:#9792a6;--gold:#d9a53b;--gold2:#ffd879;--green:#76d6b1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:14px}.topbar{min-height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:8px 18px;gap:16px;position:sticky;top:0;background:rgba(9,9,14,.97);z-index:10}.brand{font-weight:800;color:var(--gold2);white-space:nowrap}.tabs{display:flex;gap:5px;overflow:auto}.tab{border:1px solid transparent;border-radius:9px;padding:8px 11px;color:var(--muted);font-size:.78rem;text-decoration:none;white-space:nowrap}.tab.on{color:var(--gold2);border-color:#59431f;background:#211b11}main{max-width:1050px;margin:auto;padding:20px 14px 60px}.intro{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.intro h1{font-size:1.35rem;margin:0 0 6px}.intro p{font-size:.76rem;color:var(--muted);margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:13px}.title{font-weight:800;color:var(--gold2);font-size:.92rem;margin-bottom:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field{margin-bottom:10px}.field label{display:block;color:#bbb5c9;font-size:.72rem;margin-bottom:5px}input,select,textarea{width:100%;background:#0b0b11;border:1px solid #30303e;border-radius:9px;color:var(--text);padding:10px;font:inherit;font-size:.82rem}textarea{min-height:76px;resize:vertical}.pillar{text-align:center}.pillar input{text-align:center;font-size:1rem}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#b77a14,#e3b34e);color:#15100a}.btn.ghost{background:#1b1b25;color:#c9c3d4;border:1px solid #30303e}.summary{display:flex;flex-wrap:wrap;gap:7px;color:#d8cfeb;font-size:.75rem}.summary span{background:#191721;border:1px solid #332e41;border-radius:999px;padding:6px 9px}.status{color:var(--green);font-size:.75rem;min-height:20px;margin-top:8px}.note{font-size:.72rem;color:var(--muted);line-height:1.55;margin:-5px 0 12px}.elements{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.elements label{text-align:center}.elements input{text-align:center}@media(max-width:700px){.grid2,.grid4{grid-template-columns:1fr 1fr}.elements{grid-template-columns:repeat(5,1fr)}.topbar{padding:8px 10px}.brand{font-size:.82rem}}@media(max-width:480px){.grid2{grid-template-columns:1fr}.elements{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header class="topbar"><div class="brand">✦ 천운 상담도구</div><nav class="tabs"><a class="tab" href="/">💬 상담</a><a class="tab" href="/ziwei.html">⭐ 자미두수</a><a class="tab" href="/clients.html">📁 고객관리</a><a class="tab on" href="#">🧭 사주 기본분석</a></nav></header>
<main><div class="intro"><div><h1>🧭 사주 기본분석 양식</h1><p>선택한 고객의 사주 구조와 상담 근거를 체계적으로 기록합니다. 이 내용도 브라우저와 외장메모리 백업에만 저장됩니다.</p></div><button class="btn ghost" onclick="location.href='/clients.html'">고객관리로 돌아가기</button></div>
<section class="card"><div class="title">고객 연결</div><div class="field"><label>분석할 고객</label><select id="clientSelect" onchange="loadClient(this.value)"></select></div><div id="clientSummary" class="summary"></div></section>
<form id="analysisForm" onsubmit="saveAnalysis(event)">
<section class="card"><div class="title">① 원국 기본표</div><div class="note">앱에서 계산한 명식을 확인한 뒤 상담사가 검토하여 기록합니다. 자동 계산 결과를 맹신하지 않습니다.</div><div class="grid4"><div class="pillar"><label>년주</label><input id="yearPillar" placeholder="예: 기유"></div><div class="pillar"><label>월주</label><input id="monthPillar"></div><div class="pillar"><label>일주</label><input id="dayPillar"></div><div class="pillar"><label>시주</label><input id="hourPillar"></div></div><div class="grid2" style="margin-top:12px"><div class="field"><label>일간·일주 핵심</label><textarea id="dayMaster"></textarea></div><div class="field"><label>음양 균형과 신강·신약 판단</label><textarea id="strength"></textarea></div></div></section>
<section class="card"><div class="title">② 오행·십성·구조</div><div class="elements"><div><label>목</label><input id="wood" type="number" min="0" max="20" value="0"></div><div><label>화</label><input id="fire" type="number" min="0" max="20" value="0"></div><div><label>토</label><input id="earth" type="number" min="0" max="20" value="0"></div><div><label>금</label><input id="metal" type="number" min="0" max="20" value="0"></div><div><label>수</label><input id="water" type="number" min="0" max="20" value="0"></div></div><div class="grid2" style="margin-top:12px"><div class="field"><label>오행의 강약과 조후</label><textarea id="elementsNote"></textarea></div><div class="field"><label>십성 배치와 핵심 관계</label><textarea id="tenGods"></textarea></div><div class="field"><label>합·충·형·파·해와 주요 구조</label><textarea id="relations"></textarea></div><div class="field"><label>격국·특수구조 검토</label><textarea id="structure"></textarea></div></div></section>
<section class="card"><div class="title">③ 용신과 운의 흐름</div><div class="grid2"><div class="field"><label>용신·희신 및 판단 근거</label><textarea id="usefulGod"></textarea></div><div class="field"><label>기신·주의 요소 및 판단 근거</label><textarea id="cautionGod"></textarea></div><div class="field"><label>대운 방향·시작 나이·현재 대운</label><textarea id="decade"></textarea></div><div class="field"><label>세운·가까운 시기 흐름</label><textarea id="yearFlow"></textarea></div></div></section>
<section class="card"><div class="title">④ 삶의 영역별 기본 해석</div><div class="grid2"><div class="field"><label>기질·강점·반복 패턴</label><textarea id="temperament"></textarea></div><div class="field"><label>직업·사업·재능</label><textarea id="career"></textarea></div><div class="field"><label>재물과 현실 운영</label><textarea id="wealth"></textarea></div><div class="field"><label>연애·결혼·관계</label><textarea id="relationship"></textarea></div><div class="field"><label>가족·주변 관계</label><textarea id="family"></textarea></div><div class="field"><label>변화·이동·생활 리듬</label><textarea id="change"></textarea></div></div></section>
<section class="card"><div class="title">⑤ 상담용 정리</div><div class="grid2"><div class="field"><label>확실하게 말할 수 있는 근거</label><textarea id="evidence"></textarea></div><div class="field"><label>추가 확인이 필요한 부분</label><textarea id="uncertain"></textarea></div><div class="field"><label>자미두수로 세밀하게 확인할 항목</label><textarea id="ziweiCheck"></textarea></div><div class="field"><label>타로를 추가할지 판단</label><select id="tarotDecision"><option>추가하지 않음</option><option>가까운 시기·선택지 확인에 추가</option><option>내담자 요청 시 추가</option><option>판단 보류</option></select><textarea id="tarotReason" placeholder="추가 또는 제외한 이유" style="margin-top:7px"></textarea></div></div><div class="field"><label>상담사가 전달할 핵심 3가지</label><textarea id="keyPoints"></textarea></div><div class="field"><label>단정하지 않고 제시할 현실적인 선택지</label><textarea id="options"></textarea></div><div class="actions"><button class="btn" type="submit">사주 기본분석 저장</button><button class="btn ghost" type="button" onclick="clearAnalysis()">양식 비우기</button></div><div id="saveStatus" class="status"></div></section>
</form></main><script src="/saju-analysis.js"></script></body></html>
