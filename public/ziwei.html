<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>✦ 천운 자미두수 상담</title>
  <style>
    :root{--bg:#09090e;--card:#12121a;--line:#292938;--text:#eeeaf7;--muted:#9792a6;--gold:#d9a53b;--gold2:#ffd879;--purple:#7658bc;--purple2:#b99af8;--red:#ff7b83}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
    .topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:16px;position:sticky;top:0;background:rgba(9,9,14,.96);z-index:10}
    .brand{font-weight:800;color:var(--gold2);white-space:nowrap}.tabs{display:flex;gap:5px;overflow-x:auto}.tab{border:1px solid transparent;border-radius:9px;padding:8px 11px;color:var(--muted);font-size:.78rem;text-decoration:none;white-space:nowrap}.tab.on{color:var(--gold2);border-color:#59431f;background:#211b11}
    main{max-width:980px;margin:0 auto;padding:20px 14px 60px}.intro{margin-bottom:16px}.intro h1{font-size:1.35rem;margin:0 0 7px}.intro p{font-size:.8rem;color:var(--muted);line-height:1.55;margin:0}
    .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:13px}.card-title{font-weight:800;color:var(--gold2);font-size:.92rem;margin-bottom:14px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{margin-bottom:11px}.field label{display:block;color:#bbb5c9;font-size:.73rem;margin-bottom:6px}input,select,textarea{width:100%;background:#0b0b11;border:1px solid #30303e;border-radius:9px;color:var(--text);padding:10px 11px;font:inherit;font-size:.84rem}textarea{min-height:84px;resize:vertical}.inline-check{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.75rem}.inline-check input{width:auto}
    .btn{width:100%;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#b77a14,#e3b34e);color:#15100a}.btn:disabled{opacity:.55;cursor:wait}.error{color:var(--red);font-size:.78rem;margin-top:9px}
    .zw-summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.zw-summary span{font-size:.69rem;color:#d8cfeb;background:#1b1825;border:1px solid #352d4b;border-radius:999px;padding:5px 8px}.zw-current{font-size:.76rem;color:var(--purple2);margin:10px 0}.zw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.zw-palace{min-height:96px;border:1px solid #302b3d;border-radius:10px;padding:9px;background:#0d0c13}.zw-palace.soul{border-color:var(--gold);box-shadow:0 0 0 1px rgba(217,165,59,.16) inset}.zw-palace-head{display:flex;justify-content:space-between;gap:5px;font-size:.74rem}.zw-palace-head b{color:var(--gold2)}.zw-palace-head span{color:var(--muted);font-size:.65rem}.zw-stars{font-size:.76rem;line-height:1.45;margin-top:8px}.zw-decade{font-size:.63rem;color:#817b8e;margin-top:7px}.zw-note{font-size:.67rem;color:var(--muted);line-height:1.5;margin:11px 0 0}.zw-data-strip{margin:10px 0;padding:9px 10px;border:1px solid #3a304b;border-radius:9px;background:#171321;color:#b9afc8;font-size:.68rem;line-height:1.55}.zw-report-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 14px}.zw-report-meta div{border:1px solid #352d47;border-radius:9px;padding:9px;background:#0d0c13;font-size:.7rem;color:#bcb4c9}.zw-report-meta b{display:block;color:#ffd879;margin-bottom:3px}.zw-overall{border:1px solid #6e4f1e;background:linear-gradient(135deg,#21180c,#15120d);border-radius:12px;padding:13px;margin-bottom:12px}.zw-overall h3{margin:0 0 7px;color:#ffd879;font-size:.92rem}.zw-evidence{font-size:.66rem;color:#988ea4;margin-top:8px;padding-top:7px;border-top:1px dashed #3a304b}@media(max-width:680px){.zw-report-meta{grid-template-columns:1fr 1fr}}
    .bubble{border-left:3px solid var(--purple);background:#0d0d14;border-radius:5px 12px 12px 5px;padding:12px 13px;margin:9px 0;font-size:.84rem;line-height:1.65}.bubble-num{display:block;color:var(--purple2);font-size:.64rem;font-weight:800;margin-bottom:4px}.copy{float:right;background:none;border:0;color:var(--muted);font-size:.68rem;cursor:pointer}.loading{color:var(--muted);font-size:.8rem;text-align:center;padding:16px}
    .zw-chat-log{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px;margin-bottom:4px}
    .zw-chat-msg{border-radius:12px;padding:10px 12px;font-size:.83rem;line-height:1.6;max-width:88%}
    .zw-chat-msg b{display:block;font-size:.66rem;color:var(--muted);margin-bottom:3px;font-weight:700}
    .zw-chat-msg.me{align-self:flex-end;background:#1c1730;border:1px solid #352c55;color:var(--text)}
    .zw-chat-msg.me b{color:var(--purple2)}
    .zw-chat-msg.ai{align-self:flex-start;background:#0d0d14;border:1px solid var(--line)}
    .zw-chat-msg.ai b{color:var(--gold2)}
    .zw-chat-actions{display:flex;gap:8px;margin-top:10px}
    .zw-chat-actions .btn.ghost{background:transparent;border:1px solid #30303e;color:var(--muted);font-weight:700}
    #zFollowup{min-height:56px}
    @media(max-width:680px){.grid2{grid-template-columns:1fr}.zw-grid{grid-template-columns:repeat(2,1fr)}.topbar{padding:0 10px}.brand{font-size:.83rem}.zw-chat-msg{max-width:96%}.zw-chat-log{max-height:44vh}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">✦ 천운 상담도구</div>
    <nav class="tabs">
      <a class="tab" href="/">💬 상담</a>
      <a class="tab" href="/#call">📞 전화상담</a>
      <a class="tab" href="/#why">🤔 왜요?</a>
      <a class="tab on" href="/ziwei.html">⭐ 자미두수</a>
      <a class="tab" href="/clients.html">📁 고객관리</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h1>⭐ 자미두수 평생 풀이</h1>
      <p>계산된 명반과 해석을 분리해 자미두수 전체 풀이를 만듭니다. 총운·성격·재물·직업·결혼·가족·건강·대운·올해 흐름을 명반의 궁·주성·보조성·밝기·사화 근거와 함께 정리합니다. 출생시간이 불확실하면 명반이 달라질 수 있어 시간을 확인한 뒤 계산합니다.</p>
    </section>

    <section class="card">
      <div class="card-title">📋 내담자 정보</div>
      <div class="field"><label>고객관리에서 불러오기</label><select id="zManagedClient" onchange="loadZiweiManagedClient()"><option value="">저장된 고객을 선택하세요</option></select></div>
      <div class="grid2">
        <div class="field"><label>이름 / 닉네임</label><input id="zName" placeholder="예) 김미나"></div>
        <div class="field"><label>성별</label><select id="zGender"><option value="여성">여성</option><option value="남성">남성</option></select></div>
        <div class="field"><label>양력 / 음력</label><select id="zCalendar" onchange="toggleLeap()"><option value="양력">양력</option><option value="음력">음력</option></select></div>
        <div class="field"><label>생년월일</label><input id="zBirth" type="date"></div>
        <div class="field"><label>태어난 시간</label>
          <select id="zHour"><option value="">시간을 선택하세요</option><option>자시</option><option>축시</option><option>인시</option><option>묘시</option><option>진시</option><option>사시</option><option>오시</option><option>미시</option><option>신시</option><option>유시</option><option>술시</option><option>해시</option></select>
        </div>
      </div>
      <label id="leapWrap" class="inline-check" style="display:none"><input id="zLeap" type="checkbox"> 음력 윤달</label>
      <div class="field" style="margin-top:10px"><label>특히 더 자세히 봐 줄 부분 (선택)</label><textarea id="zQuestion" placeholder="예) 재혼 가능성, 노후 재물. 비워 두면 전체를 고르게 풀이합니다."></textarea></div>
      <button id="zStart" class="btn" onclick="startZiwei()">⭐ 명반 계산 및 평생 풀이 만들기</button>
      <div id="zError" class="error"></div>
    </section>

    <section id="zChart"></section>
    <section id="zResult"></section>

    <section id="zChatSection" style="display:none">
      <div class="card">
        <div class="card-title">💬 이어서 질문하기</div>
        <div id="zChatLog" class="zw-chat-log"></div>
        <div class="field" style="margin-top:6px">
          <textarea id="zFollowup" placeholder="추가로 궁금한 점을 입력하세요. (Enter 전송 / Shift+Enter 줄바꿈)" onkeydown="handleZiweiKeydown(event)"></textarea>
        </div>
        <div class="zw-chat-actions">
          <button id="zSendBtn" class="btn" onclick="sendZiweiFollowup()" style="flex:2">질문 보내기</button>
          <button class="btn ghost" onclick="resetZiweiConsult()" style="flex:1">새 상담 시작</button>
        </div>
        <div id="zChatError" class="error"></div>
      </div>
    </section>
  </main>

  <script src="/korean-lunar.js"></script>
  <script src="/vendor/iztro-v2.6.0.min.js"></script>
  <script src="/ziwei.js"></script>
  <script>
    const API_BASE = location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? 'http://localhost:3000' : '';
    const Z_MANAGED_CLIENT_KEY = 'cheonun.clients.v1';

    // 후속 채팅 상태 — 최초 명반/상담과 별개로, 세션 동안만 유지 (페이지 새로고침 시 초기화)
    let ziweiChart = null;
    let ziweiName = '내담자';
    let ziweiHistory = []; // [{role:'user'|'assistant', content:string}, ...]
    let ziweiSending = false;

    function getZiweiManagedClients(){
      try{ const rows=JSON.parse(localStorage.getItem(Z_MANAGED_CLIENT_KEY)||'[]'); return Array.isArray(rows)?rows:[]; }
      catch(e){ return []; }
    }

    function renderZiweiManagedClients(){
      const rows=getZiweiManagedClients();
      document.getElementById('zManagedClient').innerHTML='<option value="">저장된 고객을 선택하세요</option>'+rows.map(function(r,index){return '<option value="'+index+'">'+escapeHtml(r.name)+' · '+escapeHtml(r.birth||'생년월일 미입력')+'</option>';}).join('');
    }

    function loadZiweiManagedClient(){
      const selected=document.getElementById('zManagedClient').value;
      const r=selected===''?null:getZiweiManagedClients()[Number(selected)];
      if(!r){ document.getElementById('zError').textContent='불러올 고객을 선택해 주세요.'; return; }
      const topicMap={'직업/사업':'직업/사업운','재물':'재물운','연애/결혼':'연애/결혼','가족':'가족관계','인간관계':'인간관계','이동/변화':'이동/변화','종합운':'종합운'};
      document.getElementById('zName').value=r.name||'';
      if(r.gender==='여성'||r.gender==='남성') document.getElementById('zGender').value=r.gender;
      document.getElementById('zCalendar').value=r.calendar||'양력';
      toggleLeap();
      document.getElementById('zBirth').value=r.birth||'';
      document.getElementById('zHour').value=r.birthHour||'';
      document.getElementById('zLeap').checked=!!r.leap;
      document.getElementById('zQuestion').value=r.question||r.reason||'';
      document.getElementById('zError').textContent='고객정보를 불러왔습니다.';
    }

    function toggleLeap(){
      const isLunar = document.getElementById('zCalendar').value === '음력';
      const birth = document.getElementById('zBirth');
      document.getElementById('leapWrap').style.display = isLunar ? 'flex' : 'none';
      birth.type = isLunar ? 'text' : 'date';
      birth.placeholder = isLunar ? '예) 1969-8-1' : '';
    }

    renderZiweiManagedClients();

    async function callAi(prompt,maxTokens){
      const response = await fetch(API_BASE + '/api/ai', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,maxTokens:maxTokens||4096})});
      const data = await response.json().catch(function(){ return {}; });
      if(!response.ok) throw new Error(data.error || 'AI 상담 요청에 실패했습니다.');
      return data.text || '';
    }

    // 평생 풀이는 길어서 3부분으로 나눠 동시에 만든 뒤 순서대로 이어 붙인다 (한 번에 만들면 잘리거나 오래 걸림)
    const ZIWEI_REPORT_PARTS = [
      { title:'타고난 성격과 평생운', sections:[
        '## 0. 총운 한눈에 보기 — 명궁·신궁·명주·신주·오행국과 삼방사정의 핵심을 먼저 요약하고, 평생의 강점·반복 과제·현재 대한·올해 흐름을 한 번에 정리',
        '## 1. 명반 한눈에 보기 — 명궁·신궁의 주성과 사화로 본 삶의 큰 틀 (전문용어는 쉬운 뜻을 붙여서)',
        '## 2. 타고난 성격과 기질 — 겉으로 보이는 모습과 속마음, 장점과 조심할 점',
        '## 3. 평생운의 큰 흐름 — 초년·청년·중년·말년으로 나눠 어떤 삶을 살게 되는지',
        '## 4. 형제·친구·대인관계 — 형제궁·노복궁(교우궁)으로 본 사람 복과 인간관계'
      ]},
      { title:'재물·직업·결혼·가족·건강', sections:[
        '## 5. 재물운 — 재백궁·전택궁: 돈이 들어오는 방식, 모으는 법, 새는 곳, 부동산·노후 재물',
        '## 6. 직업·사업운 — 관록궁: 잘 맞는 일과 분야, 직장형인지 사업형인지, 성공하는 방식',
        '## 7. 결혼·애정운 — 부처궁: 배우자 성향, 결혼 시기 흐름, 부부 관계에서 조심할 점, 재혼·인연 흐름',
        '## 8. 자녀·가족운 — 자녀궁·부모궁·전택궁: 자녀 인연, 부모와의 관계, 집안 분위기',
        '## 9. 건강운 — 질액궁: 약하게 타고난 부분과 생활 관리법 (병명 단정 금지, 생활 습관 중심)'
      ]},
      { title:'대운 흐름과 올해 운', sections:[
        '## 10. 10년 대운 흐름 — 명반의 대한을 처음부터 80대까지 순서대로, 각 대한마다 나이 범위·좋은 점·조심할 점 (지나간 대한은 짧게, 현재와 앞으로의 대한은 자세히)',
        '## 11. 현재 대운 자세히 — 지금 지나고 있는 대한에서 꼭 알아야 할 것',
        '## 12. 올해 운세 — 올해 유년으로 본 재물·일·관계·건강 흐름과 주의점',
        '## 13. 평생 개운법과 마무리 — 이 명반을 가진 분이 운을 살리는 방법 3~5가지와 따뜻한 마무리 인사'
      ]}
    ];

    function buildZiweiReportPrompt(name, gender, question, chart, part){
      return `당신은 자미두수 전통 삼합파를 공부하고 실제 상담에 적용하는 상담사 천운입니다.
${name}님(${gender})께 평생사주와 함께 드릴 "자미두수 평생 풀이" 원고 가운데 일부를 씁니다.
이 글은 상담 대화가 아니라 고객이 두고두고 읽는 풀이 문서입니다.

━━━ 계산된 명반 (그대로 사용, 임의 재계산 금지) ━━━
${CheonunZiwei.toPrompt(chart)}

${question ? '특히 자세히 봐 달라는 부분: ' + question + '\n(관련된 장에서 더 깊게 다룰 것)\n' : ''}
━━━ 이번에 쓸 부분: ${part.title} ━━━
아래 순서대로 각 장을 작성한다. 제목 줄에는 "## 번호. 짧은 제목"만 쓰고, → 뒤의 안내 문구는 제목에 넣지 말고 본문 내용으로만 반영한다.
${part.sections.map(function(s){ const i=s.indexOf(' — '); return s.slice(0,i) + '\n   → 쓸 내용: ' + s.slice(i+3); }).join('\n')}

━━━ 해석 규칙 ━━━
• 각 장은 해당 궁의 주성·보조성·부가성·밝기·사화를 근거로 삼고, 가능하면 삼방사정(마주 보는 궁과 삼합 궁)을 함께 본다.
• 0장 총운은 명궁·신궁·명주·신주·오행국·현재 대한·현재 유년명궁을 근거로 작성하고, 강점 3개·주의점 3개·현실적인 행동 3개를 포함한다.
• 근거가 된 궁과 별을 문장 속에 자연스럽게 밝힌다. (예: "재백궁의 무곡성(재물을 다루는 별)이…")
• 명반에 없는 별·궁·사화를 만들어내지 않는다. 별 하나만으로 길흉을 단정하지 않는다.
• 근거 없는 정확한 날짜·퍼센트는 만들지 않는다. 나이·시기는 명반의 대한·유년 범위 안에서만 말한다.
• 의료·법률·투자·수명은 단정하지 않는다. "무조건", "반드시 일어난다", "큰일 난다" 같은 단정·공포 표현 금지.
• 좋은 점과 조심할 점을 균형 있게 쓰고, 조심할 점에는 현실적인 대처법을 붙인다.

━━━ 문체와 분량 ━━━
• 따뜻하고 정중한 존댓말 문서체. ${name}님을 직접 부르며 쓴다.
• 총운(0장)은 500~700자, 나머지 각 장은 600~900자로 충분히 자세하게 쓴다.
• 제목 줄은 "## 번호. 짧은 제목" 형식만 사용하고, 본문에는 다른 마크다운 기호(**, *, 표)를 쓰지 않는다.
• [말풍선], AI, 인공지능, assistant, 답변 1 같은 표기와 메타 발언을 절대 출력하지 않는다.
• 어려운 한자는 피하고 전문용어에는 괄호로 쉬운 뜻을 붙인다.
• 인사말이나 "다음 부분에서…" 같은 연결 문장 없이 제목부터 바로 시작한다.`;
    }

    function escapeHtml(value){
      return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    let ziweiReportText = '';

    function renderZiweiReport(name, text){
      const sections = text.split(/^##\s*/m).map(function(x){return x.trim();}).filter(function(x){return x.length>5;});
      return '<div class="card"><div class="card-title" style="display:flex;justify-content:space-between;align-items:center">⭐ '+escapeHtml(name)+'님 자미두수 평생 풀이<button class="copy" style="float:none;font-size:.78rem;color:var(--gold2)" onclick="copyZiweiReport(this)">전체 복사</button></div>' + sections.map(function(sec){
        const lines = sec.split('\n');
        const title = lines.shift().trim();
        const body = lines.join('\n').replace(/\*\*/g,'').trim();
        return '<div class="bubble"><button class="copy" onclick="copyBubble(this)">복사</button><b style="display:block;color:var(--gold2);margin-bottom:6px">'+escapeHtml(title)+'</b>'+escapeHtml(body).replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>')+'</div>';
      }).join('') + '</div>';
    }

    function copyZiweiReport(button){
      navigator.clipboard.writeText(ziweiReportText.replace(/^##\s*/gm,'■ ').replace(/\*\*/g,''));
      button.textContent = '복사 완료'; setTimeout(function(){button.textContent='전체 복사';},1200);
    }

    function copyBubble(button){
      const text = button.parentElement.innerText.replace(/^복사\s*/, '').trim();
      navigator.clipboard.writeText(text);
      button.textContent = '완료'; setTimeout(function(){button.textContent='복사';},900);
    }

    async function startZiwei(){
      const error = document.getElementById('zError');
      const button = document.getElementById('zStart');
      const name = document.getElementById('zName').value.trim() || '내담자';
      const gender = document.getElementById('zGender').value;
      const question = document.getElementById('zQuestion').value.trim();
      error.textContent = '';
      try{
        const chart = CheonunZiwei.calculate({
          birth: document.getElementById('zBirth').value,
          hour: document.getElementById('zHour').value,
          gender: document.getElementById('zGender').value,
          calendar: document.getElementById('zCalendar').value,
          isLeap: document.getElementById('zLeap').checked,
          targetDate: new Date()
        });
        document.getElementById('zChart').innerHTML = CheonunZiwei.render(chart,name);
        window.ziweiChart = chart; window.ziweiName = name;
        document.getElementById('zResult').innerHTML = '<div class="card loading">명반을 바탕으로 평생 풀이를 쓰고 있습니다… (1~2분 걸릴 수 있어요)</div>';
        button.disabled=true; button.textContent='평생 풀이 작성 중…';
        const texts = await Promise.all(ZIWEI_REPORT_PARTS.map(function(part){
          return callAi(buildZiweiReportPrompt(name,gender,question,chart,part),8192);
        }));
        const text = texts.map(function(t){return t.trim();}).join('\n\n').replace(/^(##[^\n]*?)\s*(?:—|→|\(|:)[^\n]*$/gm,'$1');
        ziweiReportText = text;
        document.getElementById('zResult').innerHTML = renderZiweiReport(name,text);

        // 후속 채팅 세션 시작 — 명반과 최초 문답을 대화 기록에 남겨서 이어지는 질문에서도 맥락 유지
        ziweiChart = chart;
        ziweiName = name;
        ziweiHistory = [
          { role:'user', content: question || '자미두수 평생 풀이 요청' },
          { role:'assistant', content: text.replace(/^##\s*/gm,'').trim() }
        ];
        document.getElementById('zChatLog').innerHTML = '';
        document.getElementById('zChatError').textContent = '';
        document.getElementById('zChatSection').style.display = 'block';
      }catch(e){
        error.textContent = e.message;
        document.getElementById('zResult').innerHTML='';
      }finally{
        button.disabled=false; button.textContent='⭐ 명반 계산 및 평생 풀이 만들기';
      }
    }

    function appendZiweiChatBubble(role, text){
      const log = document.getElementById('zChatLog');
      const div = document.createElement('div');
      div.className = 'zw-chat-msg ' + (role === 'user' ? 'me' : 'ai');
      const label = role === 'user' ? (escapeHtml(ziweiName) + '님') : '천운';
      const copyBtn = role === 'user' ? '' : '<button class="copy" onclick="copyZiweiMsg(this)" style="float:right">복사</button>';
      div.innerHTML = copyBtn + '<b>' + label + '</b>' + escapeHtml(text).replace(/\n/g,'<br>');
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function copyZiweiMsg(button){
      const text = button.parentElement.innerText.replace(/^복사\s*/, '').trim();
      navigator.clipboard.writeText(text);
      button.textContent = '완료'; setTimeout(function(){button.textContent='복사';},900);
    }

    function handleZiweiKeydown(e){
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        sendZiweiFollowup();
      }
    }

    function buildZiweiFollowupPrompt(question){
      const historyText = ziweiHistory.slice(-6).map(function(h){
        return (h.role === 'user' ? '내담자: ' : '상담사: ') + h.content;
      }).join('\n');

      return `당신은 자미두수 전통 삼합파를 공부하고 실제 상담에 적용하는 상담사 천운입니다.
지금 ${ziweiName}님과 자미두수 상담을 이어서 하는 중입니다. 명반은 이미 계산되어 있으니 절대 다시 계산하지 말고 아래 명반을 그대로 사용하세요.

━━━ 계산된 명반 (그대로 사용, 임의 재계산 금지) ━━━
${CheonunZiwei.toPrompt(ziweiChart)}

━━━ 지금까지 나눈 대화 ━━━
${historyText}

━━━ 새 질문 ━━━
${question}

━━━ 규칙 ━━━
• 명반에 없는 별·궁·사화를 만들어내지 않는다.
• "무조건", "반드시 일어난다", "큰일 난다" 같은 단정 금지. 의료·법률·투자·수명 단정 금지.
• [말풍선] 태그 1개만, 2~4문장으로 짧고 구체적인 대화체로 쓴다.
• 어려운 한자는 피하고 전문용어에는 바로 쉬운 뜻을 붙인다.`;
    }

    async function sendZiweiFollowup(){
      if(ziweiSending) return;
      const input = document.getElementById('zFollowup');
      const question = input.value.trim();
      if(!question) return;

      const errorEl = document.getElementById('zChatError');
      const sendBtn = document.getElementById('zSendBtn');
      if(!ziweiChart){ errorEl.textContent = '먼저 위에서 명반을 계산해주세요.'; return; }

      errorEl.textContent = '';
      appendZiweiChatBubble('user', question);
      ziweiHistory.push({ role:'user', content: question });
      input.value = '';

      ziweiSending = true;
      sendBtn.disabled = true;
      sendBtn.textContent = '답변 작성 중…';
      const thinkingDiv = appendZiweiChatBubble('assistant', '생각하는 중…');

      try{
        const prompt = buildZiweiFollowupPrompt(question);
        const text = await callAi(prompt,1024);
        const answer = text.replace(/\[말풍선\]/g,' ').trim();
        thinkingDiv.remove();
        appendZiweiChatBubble('assistant', answer);
        ziweiHistory.push({ role:'assistant', content: answer });
      }catch(e){
        thinkingDiv.remove();
        errorEl.textContent = e.message;
        // 명반과 지금까지의 대화 기록은 그대로 유지한다 (오류가 나도 안 사라짐)
      }finally{
        ziweiSending = false;
        sendBtn.disabled = false;
        sendBtn.textContent = '질문 보내기';
      }
    }

    function resetZiweiConsult(){
      ziweiChart = null;
      ziweiHistory = [];
      document.getElementById('zChart').innerHTML = '';
      document.getElementById('zResult').innerHTML = '';
      document.getElementById('zChatLog').innerHTML = '';
      document.getElementById('zChatSection').style.display = 'none';
      document.getElementById('zError').textContent = '';
      document.getElementById('zChatError').textContent = '';
      document.getElementById('zQuestion').value = '';
      document.getElementById('zFollowup').value = '';
    }
  </script>
<script src="/ziwei-ui-cleanup.js"></script>
